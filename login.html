<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodlify — Iniciar Sesión</title>
  
  <meta name="description" content="Acceso a la plataforma de administración centralizada de Moodle" />
  <meta name="theme-color" content="#2563eb" />

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192' fill='%232563eb'%3E%3Crect width='192' height='192' rx='40' fill='%232563eb'/%3E%3Cpath d='M48 64h24v64H48zm36-16h24v80H84zm36 24h24v56h-24z' fill='%23ffffff'/%3E%3C/svg%3E" />

  <!-- Fonts & Core Stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.08), transparent 70%), var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-xl);
      padding: 2.25rem 2rem;
      backdrop-filter: blur(12px);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      margin-bottom: 1rem;
    }

    .login-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--muted-light);
      font-size: 0.775rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }

    .divider:not(:empty)::before { margin-right: 0.75rem; }
    .divider:not(:empty)::after { margin-left: 0.75rem; }

    .top-right-theme {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Theme Toggle in Top Corner -->
  <div class="top-right-theme">
    <button class="btn btn-secondary btn-icon" id="login-theme-btn" title="Cambiar Tema" aria-label="Cambiar Tema">
      <i data-lucide="sun-moon" style="width: 18px; height: 18px;"></i>
    </button>
  </div>

  <div class="login-container animate-fade-in">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/>
            <path d="M6 6h10"/>
            <path d="M6 10h10"/>
          </svg>
        </div>
        <h1 class="login-title">Iniciar Sesión en Moodlify</h1>
        <p class="login-subtitle">Accede al panel centralizado de tus plataformas Moodle</p>
      </div>

      <!-- Google OAuth Button -->
      <button class="btn btn-secondary" style="width: 100%; margin-bottom: 0.75rem;" onclick="handleGoogleLogin(this)">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuar con Google Workspace
      </button>

      <div class="divider">o con credenciales</div>

      <!-- Email/Password Form -->
      <form id="login-form" onsubmit="handleFormLogin(event)">
        <div class="form-group">
          <label class="form-label required">Correo Electrónico Institucional</label>
          <div class="input-icon-wrapper">
            <i data-lucide="mail"></i>
            <input type="email" class="form-input" id="login-email" placeholder="admin@universidad.edu" value="victor.lorenzo@universidad.edu" required />
          </div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="form-label required" style="margin: 0;">Contraseña</label>
            <a href="#" style="font-size: 0.775rem;" onclick="handleForgotPassword(event)">¿Olvidaste tu contraseña?</a>
          </div>
          <div class="input-icon-wrapper">
            <i data-lucide="lock"></i>
            <input type="password" class="form-input" id="login-password" placeholder="••••••••" value="moodlify2026" required />
            <button type="button" class="btn btn-ghost btn-sm" style="position: absolute; right: 0.5rem; padding: 0.25rem;" onclick="togglePasswordVisibility()">
              <i data-lucide="eye" id="toggle-password-icon" style="position: static; width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin: 1.15rem 0 1.5rem 0;">
          <label class="form-checkbox-label">
            <input type="checkbox" class="form-checkbox" id="login-remember" checked />
            <span style="font-size: 0.8rem;">Recordar mi sesión</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%;">
          Acceder al Panel
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--muted);">
        ¿No tienes acceso asignado? <a href="#" onclick="handleRegisterModal(event)">Solicitar cuenta</a>
      </div>
    </div>
  </div>

  <!-- Dependencies for standalone execution -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/security.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.lucide !== 'undefined') window.lucide.createIcons();

      const themeBtn = document.getElementById('login-theme-btn');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          if (window.themeManager) window.themeManager.cycleTheme();
        });
      }
    });

    async function handleFormLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;
      const submitBtn = document.getElementById('login-submit-btn');

      if (!email || !password) {
        if (window.toast) window.toast.warning('Por favor completa todos los campos');
        return;
      }

      submitBtn.classList.add('btn-loading');
      submitBtn.setAttribute('disabled', 'true');

      try {
        await window.auth.login(email, password, remember);
        const redirect = sessionStorage.getItem('moodlify_redirect_after_login') || 'index.html#dashboard';
        sessionStorage.removeItem('moodlify_redirect_after_login');
        window.location.href = redirect;
      } catch (err) {
        submitBtn.classList.remove('btn-loading');
        submitBtn.removeAttribute('disabled');
      }
    }

    async function handleGoogleLogin(btn) {
      btn.classList.add('btn-loading');
      try {
        await window.auth.loginWithGoogle();
        window.location.href = 'index.html#dashboard';
      } catch (err) {
        btn.classList.remove('btn-loading');
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const icon = document.getElementById('toggle-password-icon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (typeof window.lucide !== 'undefined') window.lucide.createIcons();
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      window.modal.open({
        title: 'Recuperación de Contraseña',
        content: `
          <p style="font-size: 0.875rem; color: var(--text); line-height: 1.5; margin-bottom: 1rem;">
            Ingresa tu correo institucional registrado. Te enviaremos un enlace seguro para restablecer tus credenciales:
          </p>
          <div class="form-group">
            <label class="form-label required">Correo Electrónico</label>
            <input type="email" class="form-input" id="recovery-email" placeholder="admin@universidad.edu" value="victor.lorenzo@universidad.edu" />
          </div>
        `,
        footer: `
          <button class="btn btn-secondary" onclick="window.modal.close()">Cancelar</button>
          <button class="btn btn-primary" onclick="if (window.toast) window.toast.success('Instrucciones enviadas a tu correo'); window.modal.close();">Enviar Enlace</button>
        `
      });
    }

    function handleRegisterModal(e) {
      e.preventDefault();
      window.modal.open({
        title: 'Solicitud de Acceso Institucional',
        content: `
          <p style="font-size: 0.875rem; color: var(--text); line-height: 1.5; margin-bottom: 1rem;">
            Las cuentas de administración de Moodlify son aprovisionadas por la Dirección de TI de cada consorcio educativo.
          </p>
          <div class="form-group">
            <label class="form-label">Institución Educativa</label>
            <input type="text" class="form-input" placeholder="Nombre de tu universidad o campus" />
          </div>
          <div class="form-group">
            <label class="form-label">Correo de Contacto</label>
            <input type="email" class="form-input" placeholder="tu.nombre@institucion.edu" />
          </div>
        `,
        footer: `
          <button class="btn btn-secondary" onclick="window.modal.close()">Cerrar</button>
          <button class="btn btn-primary" onclick="if (window.toast) window.toast.success('Solicitud enviada a la mesa de ayuda'); window.modal.close();">Enviar Solicitud</button>
        `
      });
    }
  </script>
</body>
</html>
